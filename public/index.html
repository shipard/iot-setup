<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Web Tool</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Browser compatibility banner -->
  <div id="browser-warning" class="browser-warning" hidden>
    <span data-i18n="browser_warning"></span> <strong>Chrome 89+</strong> <span data-i18n="browser_warning_or"></span> <strong>Edge 89+</strong>.
  </div>

  <header>
    <h1>ESP32 Web Tool</h1>
    <select id="lang-select" class="lang-select" aria-label="Language">
      <option value="cs">CS</option>
      <option value="en">EN</option>
    </select>
    <div id="connection-status" class="connection-status disconnected">
      <span class="status-dot"></span>
      <span id="connection-text" data-i18n="status_disconnected">Odpojeno</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="flash">Flash</button>
    <button class="tab-btn" data-tab="monitor">Monitor</button>
  </nav>

  <main>
    <!-- Flash Tab -->
    <section id="tab-flash" class="tab-content active">
      <div class="flash-controls">
        <div class="form-group">
          <label for="firmware-select" data-i18n="label_firmware">Firmware</label>
          <select id="firmware-select" disabled>
            <option value="" data-i18n="loading">Načítání...</option>
          </select>
        </div>

        <div id="firmware-description" class="firmware-description" hidden></div>

        <div class="button-row">
          <button id="connect-flash-btn" class="btn btn-primary" data-i18n="btn_connect_flash">Připojit ESP32</button>
          <button id="flash-btn" class="btn btn-success" disabled data-i18n="btn_flash">Nahrát firmware</button>
        </div>

        <div class="progress-container" hidden id="flash-progress-container">
          <div class="progress-bar">
            <div class="progress-fill" id="flash-progress" style="width: 0%"></div>
          </div>
          <span class="progress-text" id="flash-progress-text">0%</span>
        </div>
      </div>

      <div class="console-output" id="flash-log"></div>
    </section>

    <!-- Monitor Tab -->
    <section id="tab-monitor" class="tab-content">
      <div class="monitor-controls">
        <div class="monitor-controls-row">
          <div class="form-group">
            <label for="baud-rate" data-i18n="label_baud_rate">Baud rate</label>
            <select id="baud-rate">
              <option value="9600">9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200" selected>115200</option>
              <option value="230400">230400</option>
              <option value="460800">460800</option>
              <option value="921600">921600</option>
            </select>
          </div>

          <div class="form-group">
            <label for="line-ending" data-i18n="label_line_ending">Konec řádku</label>
            <select id="line-ending">
              <option value="\n" selected>LF (\n)</option>
              <option value="\r\n">CRLF (\r\n)</option>
              <option value="\r">CR (\r)</option>
              <option value="" data-i18n="line_ending_none">Žádné</option>
            </select>
          </div>

          <button id="connect-monitor-btn" class="btn btn-primary" data-i18n="btn_connect_monitor">Připojit</button>
          <button id="clear-monitor-btn" class="btn btn-secondary" data-i18n="btn_clear">Vymazat</button>
          <button id="copy-monitor-btn" class="btn btn-secondary" data-i18n="btn_copy_all">Kopírovat vše</button>
        </div>
      </div>

      <div class="console-output" id="monitor-output"></div>

      <div class="input-row">
        <input type="text" id="monitor-input" placeholder="Zadejte příkaz..." disabled
               data-i18n-placeholder="placeholder_command">
        <button id="send-btn" class="btn btn-primary" disabled data-i18n="btn_send">Odeslat</button>
      </div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
